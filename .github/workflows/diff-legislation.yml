name: Diff legislation

# On a pull request that changes legislation/: what the change does to every realm it reaches, proved with Cedar's
# SymCC, posted as a comment (realms legislation diff; docs/codices/layered-codex.md §12.3). The analysis runs in a job
# that can only read; the job that writes the comment runs nothing from the pull request: it posts the report file.
on:
  pull_request:
    paths:
      - "legislation/**"
      - ".github/workflows/diff-legislation.yml"

env:
  # The realms-gos commit whose `realms` CLI analyses the change; pinned like the one that checks (check-legislation.yml),
  # and bumped the same way.
  REALMS_GOS_COMMIT: 6a2fb57cf23ef08555caa93d8d4cc3c13e9e9dbe

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the realms CLI, at the pinned commit
        run: |
          git init -q /tmp/realms
          git -C /tmp/realms fetch -q --depth 1 https://github.com/smart-social-contracts/realms-gos.git "$REALMS_GOS_COMMIT"
          git -C /tmp/realms checkout -q FETCH_HEAD
          pip install "/tmp/realms/cli[legislation]"

      - name: Cedar analysis tools
        uses: actions/cache@v4
        with:
          path: .cache/cedar-tools
          key: cedar-tools-cli-4.14.1-cvc5-1.3.1
      - run: /tmp/realms/scripts/cedar_tools.sh .cache/cedar-tools >> "$GITHUB_ENV"

      - name: Analyse the change
        id: analyse
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # from where the branch left the base, so that what the base gained since is not part of the change
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          status=0
          realms legislation diff legislation --base "$base" --head "$HEAD_SHA" --out report.md 2> analyse.log || status=$?
          if [ ! -s report.md ]; then
            printf '<!-- realms-legislation-diff -->\n## Legislation analysis\n\nThe analysis could not run:\n\n```\n%s\n```\n' "$(cat analyse.log)" > report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: legislation-report
          path: report.md

      - name: Fail when the report lists a failure
        if: steps.analyse.outputs.status != '0'
        run: exit ${{ steps.analyse.outputs.status }}

  comment:
    needs: diff
    # A pull request from a fork has a token that cannot write: its report is in the job summary of the run above.
    if: always() && needs.diff.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legislation-report

      - name: Post the report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PULL_REQUEST" --body-file report.md --edit-last --create-if-none
