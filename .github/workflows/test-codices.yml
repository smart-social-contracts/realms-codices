name: Test Codices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch the realm SDK
        run: git clone --depth 1 --no-recurse-submodules https://github.com/smart-social-contracts/realms-gos.git ../realms-gos

      - name: Run codex hook tests
        run: pip install pytest && REALM_BACKEND=../realms-gos/src/realm_backend pytest tests -q
