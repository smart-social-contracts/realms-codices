name: Test Codices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install realms CLI
        run: |
          git clone --depth 1 --no-recurse-submodules https://github.com/smart-social-contracts/realms.git /tmp/realms
          pip install /tmp/realms/cli

      - name: Run codex tests
        run: realms test codices/ --verbose
